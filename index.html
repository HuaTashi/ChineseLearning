<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ханьцзы</title>
<style>
  :root {
    --sage: #9CAF88;
    --sage-light: #E8EDE4;
    --bg: #FAF8F3;
    --text: #3D3D3D;
    --muted: #8A8A8A;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  header {
    width: 100%;
    max-width: 500px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--sage-light);
  }
  h1 { font-size: 20px; font-weight: 500; color: var(--sage); }
  .counter { font-size: 14px; color: var(--muted); }
  .card {
    width: 100%;
    max-width: 500px;
    background: var(--card);
    border-radius: 20px;
    padding: 40px 24px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    text-align: center;
    cursor: pointer;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: transform 0.15s ease;
    border-top: 4px solid var(--sage);
  }
  .card:active { transform: scale(0.98); }
  .hanzi {
    font-size: 72px;
    font-weight: 400;
    letter-spacing: 4px;
    margin-bottom: 16px;
    color: var(--text);
  }
  .pinyin {
    font-size: 22px;
    color: var(--sage);
    margin-bottom: 12px;
    min-height: 30px;
  }
  .translation {
    font-size: 18px;
    color: var(--text);
    margin-bottom: 20px;
    min-height: 26px;
  }
  .example {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.5;
    padding: 12px 16px;
    background: var(--sage-light);
    border-radius: 12px;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hint {
    font-size: 13px;
    color: var(--muted);
    margin-top: 16px;
    opacity: 0.7;
  }
  .buttons {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    width: 100%;
    max-width: 500px;
  }
  button {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:active { opacity: 0.7; }
  .btn-know { background: var(--sage); color: white; }
  .btn-dont { background: var(--sage-light); color: var(--text); }
  .done {
    text-align: center;
    padding: 40px;
    color: var(--muted);
    font-size: 18px;
  }
</style>
</head>
<body>
<header>
  <h1>Ханьцзы</h1>
  <span class="counter" id="counter">1 / 30</span>
</header>

<div class="card" id="card" onclick="flip()">
  <div class="hanzi" id="hanzi">你好</div>
  <div class="pinyin" id="pinyin"></div>
  <div class="translation" id="translation"></div>
  <div class="example" id="example"></div>
  <div class="hint" id="hint">нажми, чтобы перевернуть</div>
</div>

<div class="buttons" id="buttons" style="display:none;">
  <button class="btn-dont" onclick="answer(false)">Не знаю</button>
  <button class="btn-know" onclick="answer(true)">Знаю</button>
</div>

<script>
const words = [
  {hanzi:"你好", pinyin:"nǐ hǎo", translation:"привет", example:"你好！我是学生。 — Nǐ hǎo! Wǒ shì xuéshēng. — Привет! Я студент."},
  {hanzi:"谢谢", pinyin:"xièxie", translation:"спасибо", example:"谢谢你。 — Xièxie nǐ. — Спасибо тебе."},
  {hanzi:"再见", pinyin:"zàijiàn", translation:"до свидания", example:"老师再见！ — Lǎoshī zàijiàn! — До свидания, учитель!"},
  {hanzi:"我", pinyin:"wǒ", translation:"я", example:"我是中国人。 — Wǒ shì Zhōngguórén. — Я китаец."},
  {hanzi:"你", pinyin:"nǐ", translation:"ты", example:"你是老师吗？ — Nǐ shì lǎoshī ma? — Ты учитель?"},
  {hanzi:"他", pinyin:"tā", translation:"он", example:"他是我的朋友。 — Tā shì wǒ de péngyou. — Он мой друг."},
  {hanzi:"她", pinyin:"tā", translation:"она", example:"她叫小美。 — Tā jiào Xiǎoměi. — Её зовут Сяомэй."},
  {hanzi:"们", pinyin:"men", translation:"суффикс множественного числа", example:"我们是学生。 — Wǒmen shì xuéshēng. — Мы студенты."},
  {hanzi:"是", pinyin:"shì", translation:"быть", example:"这是书。 — Zhè shì shū. — Это книга."},
  {hanzi:"不", pinyin:"bù", translation:"не", example:"我不是老师。 — Wǒ bù shì lǎoshī. — Я не учитель."},
  {hanzi:"人", pinyin:"rén", translation:"человек", example:"他是好人。 — Tā shì hǎo rén. — Он хороший человек."},
  {hanzi:"大", pinyin:"dà", translation:"большой", example:"这是大学。 — Zhè shì dàxué. — Это университет."},
  {hanzi:"小", pinyin:"xiǎo", translation:"маленький", example:"小猫很可爱。 — Xiǎo māo hěn kě'ài. — Маленькая кошка очень милая."},
  {hanzi:"中", pinyin:"zhōng", translation:"середина; Китай", example:"这是中文书。 — Zhè shì Zhōngwén shū. — Это книга на китайском."},
  {hanzi:"国", pinyin:"guó", translation:"страна", example:"中国很大。 — Zhōngguó hěn dà. — Китай большой."},
  {hanzi:"学", pinyin:"xué", translation:"учить", example:"我学中文。 — Wǒ xué Zhōngwén. — Я учу китайский."},
  {hanzi:"生", pinyin:"shēng", translation:"рождаться; студент", example:"他是学生。 — Tā shì xuéshēng. — Он студент."},
  {hanzi:"老师", pinyin:"lǎoshī", translation:"учитель", example:"老师很好。 — Lǎoshī hěn hǎo. — Учитель хороший."},
  {hanzi:"学生", pinyin:"xuéshēng", translation:"студент", example:"我是学生。 — Wǒ shì xuéshēng. — Я студент."},
  {hanzi:"朋友", pinyin:"péngyou", translation:"друг", example:"他是我的朋友。 — Tā shì wǒ de péngyou. — Он мой друг."},
  {hanzi:"家", pinyin:"jiā", translation:"дом; семья", example:"我家有四个人。 — Wǒ jiā yǒu sì gè rén. — В моей семье четыре человека."},
  {hanzi:"猫", pinyin:"māo", translation:"кошка", example:"我有两只猫。 — Wǒ yǒu liǎng zhī māo. — У меня две кошки."},
  {hanzi:"狗", pinyin:"gǒu", translation:"собака", example:"那只狗很大。 — Nà zhī gǒu hěn dà. — Та собака большая."},
  {hanzi:"水", pinyin:"shuǐ", translation:"вода", example:"我要喝水。 — Wǒ yào hē shuǐ. — Я хочу пить воду."},
  {hanzi:"茶", pinyin:"chá", translation:"чай", example:"我喜欢喝茶。 — Wǒ xǐhuan hē chá. — Я люблю пить чай."},
  {hanzi:"饭", pinyin:"fàn", translation:"еда; рис", example:"你吃饭了吗？ — Nǐ chīfàn le ma? — Ты поел?"},
  {hanzi:"吃", pinyin:"chī", translation:"есть, кушать", example:"我吃苹果。 — Wǒ chī píngguǒ. — Я ем яблоко."},
  {hanzi:"喝", pinyin:"hē", translation:"пить", example:"他喝茶。 — Tā hē chá. — Он пьёт чай."},
  {hanzi:"看", pinyin:"kàn", translation:"смотреть; читать", example:"我看书。 — Wǒ kàn shū. — Я читаю книгу."},
  {hanzi:"书", pinyin:"shū", translation:"книга", example:"这是我的书。 — Zhè shì wǒ de shū. — Это моя книга."}
];

let current = 0;
let flipped = false;
let progress = JSON.parse(localStorage.getItem('hanziProgress') || '{}');

function loadWord() {
  if (current >= words.length) {
    document.getElementById('card').innerHTML = '<div class="done">Все карточки пройдены! 🎉</div>';
    document.getElementById('buttons').style.display = 'none';
    document.getElementById('counter').textContent = words.length + ' / ' + words.length;
    return;
  }
  const w = words[current];
  document.getElementById('hanzi').textContent = w.hanzi;
  document.getElementById('pinyin').textContent = '';
  document.getElementById('translation').textContent = '';
  document.getElementById('example').textContent = '';
  document.getElementById('hint').textContent = 'нажми, чтобы перевернуть';
  document.getElementById('counter').textContent = (current + 1) + ' / ' + words.length;
  document.getElementById('buttons').style.display = 'none';
  flipped = false;
}

function flip() {
  if (flipped || current >= words.length) return;
  const w = words[current];
  document.getElementById('pinyin').textContent = w.pinyin;
  document.getElementById('translation').textContent = w.translation;
  document.getElementById('example').textContent = w.example;
  document.getElementById('hint').textContent = '';
  document.getElementById('buttons').style.display = 'flex';
  flipped = true;
}

function answer(known) {
  if (!flipped) return;
  const key = words[current].hanzi;
  if (known) {
    progress[key] = (progress[key] || 0) + 1;
  } else {
    progress[key] = 0;
  }
  localStorage.setItem('hanziProgress', JSON.stringify(progress));
  current++;
  loadWord();
}

loadWord();
</script>
</body>
</html>
